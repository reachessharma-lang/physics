<h3>Corrected Diagram: Reflection of Light Using Huygens' Principle</h3>

<figure>
<svg viewBox="0 0 850 520" role="img" aria-label="Correct Huygens construction for reflection showing normal and angles of incidence and reflection">

  <rect x="0" y="0" width="850" height="520" rx="12" fill="#111"/>

  <!-- Reflecting surface -->

<line x1="70" y1="370" x2="780" y2="370"
     stroke="white" stroke-width="4"/> <text x="650" y="405" fill="white" font-size="18">
Reflecting surface </text>

  <!-- Point of incidence O -->

  <circle cx="400" cy="370" r="5" fill="white"/>
  <text x="410" y="395" fill="white" font-size="19">O</text>

  <!-- Normal through point of incidence -->

<line x1="400" y1="75" x2="400" y2="465"
     stroke="white" stroke-width="2"
     stroke-dasharray="9 7"/> <text x="415" y="105" fill="white" font-size="18">Normal</text>

  <!-- Incident ray: ends exactly at O -->

<line x1="205" y1="100" x2="400" y2="370"
     stroke="white" stroke-width="3"/> <polygon points="400,370 386,358 391,375"
        fill="white"/> <text x="135" y="105" fill="white" font-size="18">
Incident ray </text>

  <!-- Reflected ray: starts exactly at O -->

<line x1="400" y1="370" x2="595" y2="100"
     stroke="white" stroke-width="3"/> <polygon points="595,100 580,108 591,116"
        fill="white"/> <text x="600" y="95" fill="white" font-size="18">
Reflected ray </text>

  <!-- Incident wavefront perpendicular to incident ray -->

<line x1="205" y1="100" x2="330" y2="190"
     stroke="white" stroke-width="3"/> <text x="180" y="85" fill="white" font-size="17">
Incident wavefront </text>

  <!-- Reflected wavefront perpendicular to reflected ray -->

<line x1="470" y1="270" x2="595" y2="360"
     stroke="white" stroke-width="3"/> <text x="500" y="390" fill="white" font-size="17">
Reflected wavefront </text>

  <!-- Angle of incidence -->

<path d="M400 310 A60 60 0 0 0 365 320"
     fill="none" stroke="white" stroke-width="2"/> <text x="355" y="305" fill="white" font-size="20">i</text>

  <!-- Angle of reflection -->

<path d="M400 310 A60 60 0 0 1 435 320"
     fill="none" stroke="white" stroke-width="2"/> <text x="435" y="305" fill="white" font-size="20">r</text>

  <!-- Huygens wavelet at O -->

<circle cx="400" cy="370" r="80"
       fill="none" stroke="white" stroke-width="2"/> <text x="485" y="350" fill="white" font-size="16">
Secondary </text> <text x="485" y="372" fill="white" font-size="16">
wavelet </text>

  <!-- labels -->

<text x="425" y="475" text-anchor="middle"
     fill="white" font-size="19">
i = r </text>

</svg>
<figcaption>Figure 10.3: Reflection of a plane wavefront using Huygens' principle. The normal passes through the point of incidence O, and both angles are measured from the normal.</figcaption>
</figure>

<h3>Corrected Diagram: Refraction of Light Using Huygens' Principle</h3>

<figure>
<svg viewBox="0 0 850 560" role="img" aria-label="Correct Huygens construction for refraction showing normal, incident angle and refracted angle">

  <rect x="0" y="0" width="850" height="560" rx="12" fill="#111"/>

  <!-- Interface -->

<line x1="70" y1="320" x2="780" y2="320"
     stroke="white" stroke-width="4"/> <text x="650" y="305" fill="white" font-size="18">
Boundary </text>

  <!-- Medium labels -->

  <text x="105" y="105" fill="white" font-size="20">
    Medium 1
  </text>
  <text x="105" y="135" fill="white" font-size="16">
    speed = v₁
  </text>

  <text x="105" y="465" fill="white" font-size="20">
    Medium 2
  </text>
  <text x="105" y="495" fill="white" font-size="16">
    speed = v₂ &lt; v₁
  </text>

  <!-- Point of incidence -->

  <circle cx="400" cy="320" r="5" fill="white"/>
  <text x="410" y="345" fill="white" font-size="19">O</text>

  <!-- Normal through point O -->

<line x1="400" y1="65" x2="400" y2="515"
     stroke="white" stroke-width="2"
     stroke-dasharray="9 7"/> <text x="415" y="95" fill="white" font-size="18">
Normal </text>

  <!-- Incident ray ending exactly at O -->

<line x1="220" y1="90" x2="400" y2="320"
     stroke="white" stroke-width="3"/> <polygon points="400,320 386,308 391,325"
        fill="white"/> <text x="125" y="90" fill="white" font-size="18">
Incident ray </text>

  <!-- Refracted ray starting exactly at O -->

<line x1="400" y1="320" x2="485" y2="490"
     stroke="white" stroke-width="3"/> <polygon points="485,490 473,476 469,488"
        fill="white"/> <text x="495" y="490" fill="white" font-size="18">
Refracted ray </text>

  <!-- Incident wavefront perpendicular to incident ray -->

<line x1="220" y1="90" x2="345" y2="188"
     stroke="white" stroke-width="3"/> <text x="150" y="180" fill="white" font-size="17">
Incident </text> <text x="150" y="202" fill="white" font-size="17">
wavefront </text>

  <!-- Secondary wavelet in second medium -->

<circle cx="400" cy="320" r="105"
       fill="none" stroke="white" stroke-width="2"/> <text x="515" y="350" fill="white" font-size="16">
Secondary </text> <text x="515" y="372" fill="white" font-size="16">
wavelet </text>

  <!-- Refracted wavefront tangent -->

<line x1="400" y1="320" x2="610" y2="425"
     stroke="white" stroke-width="3"/> <text x="615" y="435" fill="white" font-size="17">
Refracted wavefront </text>

  <!-- Angle of incidence -->

<path d="M400 260 A60 60 0 0 0 358 278"
     fill="none" stroke="white" stroke-width="2"/> <text x="350" y="260" fill="white" font-size="20">i</text>

  <!-- Angle of refraction -->

<path d="M400 380 A60 60 0 0 1 427 375"
     fill="none" stroke="white" stroke-width="2"/> <text x="435" y="385" fill="white" font-size="20">r</text>

  <!-- Direction -->

  <text x="545" y="255" fill="white" font-size="17">
    Towards denser medium
  </text>

</svg>
<figcaption>Figure 10.4: Refraction of a plane wavefront using Huygens' principle. The incident and refracted angles are measured from the normal at the point of incidence O.</figcaption>
</figure>
